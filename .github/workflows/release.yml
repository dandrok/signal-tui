name: release

# Three ways in, one publish path.
#
# `workflow_call` is the normal one: `release-please.yml` tags the merge commit it just
# released and calls this in the same run. A release created with the repository's
# `GITHUB_TOKEN` cannot trigger a workflow of its own, so this is a call and not an
# event — no personal token is stored to make writing a release work.
#
# `release: published` stays for a release made by hand: re-release a tag, or publish one
# whose publish failed. `workflow_dispatch` stays for the dry run — install, verify and
# pack without publishing — so the environment can be proved before a number is spent.
on:
  workflow_call:
    inputs:
      tag_name:
        description: "The tag to publish; also what the tarball is built from"
        type: string
        required: true
      dry_run:
        description: "Install, verify and pack without publishing"
        type: boolean
        required: false
        default: false
    secrets:
      NPM_TOKEN:
        required: false
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and verify without publishing"
        type: boolean
        default: true

jobs:
  publish:
    # A dispatch lets anyone with write access pick a branch, so it is honoured only from
    # main; a release event is already a tag, and a call comes from this repo's own
    # release run. The environment adds the second lock: deployment rules can restrict
    # it, and the npm trusted publisher is bound to this environment name.
    if: github.event_name == 'release' || github.event_name == 'workflow_call' || github.ref == 'refs/heads/main'
    environment: npm-publish
    # Pinned rather than `ubuntu-latest`: that label moves to Ubuntu 26.04 and the
    # publish path should not change underneath a release. Must stay GitHub-hosted
    # for trusted publishing.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # OIDC: short-lived publish credential + provenance
    steps:
      - uses: actions/checkout@v7
        with:
          # The tag being released, so what is verified and packed is what was released —
          # not whatever `main` happens to be when the job starts.
          ref: ${{ inputs.tag_name || github.event.release.tag_name || github.ref }}
          # The ancestry check below needs the history the tag was cut from.
          fetch-depth: 0
          # Auth to npm comes from OIDC, never from Git credentials.
          persist-credentials: false

      - name: Refuse to publish a commit that is not on main
        # OIDC publishes whatever the job checked out, and a tag can be made to point at
        # any commit — so the ref alone is not proof that the code was reviewed on main.
        # A dispatch from main used to give this for free; this is what keeps it true now
        # that the trigger can be a tag.
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$(git rev-parse HEAD)" FETCH_HEAD
          echo "publishing $(git rev-parse --short HEAD), an ancestor of origin/main"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Verify
        run: bun run verify

      - name: Check the package contents
        run: bun pm pack --dry-run

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1 and node >= 22.14. Rather than trust
      # whatever npm the runner image carries, install the current one; the versions
      # are printed so a future failure names the culprit.
      - name: Use a modern npm
        run: |
          npm install --global npm@latest
          node --version
          npm --version

      - name: Publish
        # A call or a release publishes unless the caller asked for a dry run; a dispatch
        # publishes only when the dry run was turned off.
        if: inputs.dry_run != true
        run: npm publish --access public --provenance
        env:
          # Deliberately allowed to be empty: npm prefers OIDC when the workflow is a
          # configured trusted publisher, and only falls back to this token while
          # bootstrapping the very first version.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
