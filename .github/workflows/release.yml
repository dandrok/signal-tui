name: release

# Two ways in, one publish path.
#
# `release: published` is the normal one: `release-please.yml` merged its release PR,
# tagged the commit it published and opened the GitHub release, and the tarball npm
# builds here is therefore the tagged commit — the tag and npm's `gitHead` cannot
# disagree, which is what a hand-made tag after the fact used to risk.
#
# `workflow_dispatch` stays for the dry run: install, verify and pack without
# publishing, so the environment and the OIDC binding can be proved before a number
# is spent. It also covers the one published version that predates trusted
# publishing, and any recovery where the release event never fired.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and verify without publishing"
        type: boolean
        default: true

jobs:
  publish:
    # `workflow_dispatch` lets anyone with write access pick a branch, so a dispatch
    # is only honoured from main; a release event is already a tag on a commit that
    # came through main. The environment adds the second lock: deployment rules can
    # restrict it, and the npm trusted publisher is bound to this environment name.
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    environment: npm-publish
    # Pinned rather than `ubuntu-latest`: that label moves to Ubuntu 26.04 and the
    # publish path should not change underneath a release. Must stay GitHub-hosted
    # for trusted publishing.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # OIDC: short-lived publish credential + provenance
    steps:
      - uses: actions/checkout@v7
        with:
          # The tag the release names, so what is verified and packed is what was
          # released — not whatever `main` happens to be when the job starts.
          ref: ${{ github.event.release.tag_name || github.ref }}
          # Auth to npm comes from OIDC, never from Git credentials.
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Verify
        run: bun run verify

      - name: Check the package contents
        run: bun pm pack --dry-run

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1 and node >= 22.14. Rather than trust
      # whatever npm the runner image carries, install the current one; the versions
      # are printed so a future failure names the culprit.
      - name: Use a modern npm
        run: |
          npm install --global npm@latest
          node --version
          npm --version

      - name: Publish
        # A release event publishes unconditionally — the merged release PR was the
        # decision. A dispatch publishes only when the dry run was turned off.
        if: github.event_name == 'release' || inputs.dry_run == false
        run: npm publish --access public --provenance
        env:
          # Deliberately allowed to be empty: npm prefers OIDC when the workflow is a
          # configured trusted publisher, and only falls back to this token while
          # bootstrapping the very first version.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
