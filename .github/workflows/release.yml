name: release

# One workflow, three ways in — and the same file npm trusts.
#
# `push` to main is the normal path. The `release-please` job reads the conventional
# commits and keeps one release PR open; the run that merges that PR tags the merge
# commit, opens the GitHub release, and the `publish` job below publishes in the same
# run. Same run on purpose: a release created with the repository's `GITHUB_TOKEN` does
# not start a workflow of its own, so a `release: published` trigger would never fire for
# the bot's release.
#
# `release: published` stays for a release made by hand, and `workflow_dispatch` for the
# dry run.
#
# Both jobs live in this one file because npm checks the *entry point* workflow's
# filename in the OIDC claim, not the file that runs `npm publish` ([npm's own note on
# `workflow_call`][1]) — splitting the publish into a reusable workflow would make npm
# validate the caller's name against the trusted publisher and fail to authenticate.
# Keeping the trusted publisher pointed at `release.yml` is also why the npmjs.com
# registration does not have to change.
#
# [1]: https://docs.npmjs.com/trusted-publishers/#troubleshooting
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and verify without publishing"
        type: boolean
        default: true

# The bot job needs to write; the publish job narrows this to `contents: read` below,
# because a job's own `permissions` replace these for that job.
permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  # Unlike CI this is not cancelled by the next push: a run can be the one that tags a
  # commit, and stopping halfway is not a state worth landing in.
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Opens or updates the release PR; on the run after that PR merges, it tags and
      # releases. Nothing is published from here.
      #
      # Pinned to the v5.0.0 commit rather than the `v5` tag: this is the one action in
      # the repo that runs with `contents: write` and `pull-requests: write`, so a
      # re-pointed tag would be able to write to the repository.
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    # `always()` because the job above is skipped on a release event and on a dispatch;
    # the condition then decides which of the three paths actually publishes.
    # A pre-release is not published at all rather than published to `latest`: this
    # project's numbering has no pre-release step, and `npm publish` without `--tag`
    # would put one on the tag every install resolves to.
    if: >
      always() && (
        needs.release-please.outputs.release_created == 'true' ||
        (github.event_name == 'release' && github.event.release.prerelease == false) ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      )
    environment: npm-publish
    # Pinned rather than `ubuntu-latest`: that label moves to Ubuntu 26.04 and the
    # publish path should not change underneath a release. Must stay GitHub-hosted
    # for trusted publishing.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # OIDC: short-lived publish credential + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tag being released, so what is verified and packed is what was released —
          # not whatever `main` happens to be when the job starts.
          ref: ${{ needs.release-please.outputs.tag_name || github.event.release.tag_name || github.ref }}
          # The ancestry check below needs the history the tag was cut from.
          fetch-depth: 0
          # Auth to npm comes from OIDC, never from Git credentials.
          persist-credentials: false

      - name: Refuse to publish a commit that is not on main
        # OIDC publishes whatever the job checked out, and a tag can be made to point at
        # any commit — so the ref alone is not proof that the code was reviewed on main.
        # A dispatch from main used to give this for free; this is what keeps it true now
        # that the trigger can be a tag.
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$(git rev-parse HEAD)" FETCH_HEAD
          echo "publishing $(git rev-parse --short HEAD), an ancestor of origin/main"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Verify
        run: bun run verify

      - name: Check the package contents
        run: bun pm pack --dry-run

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1 and node >= 22.14. Rather than trust
      # whatever npm the runner image carries, install the current one; the versions
      # are printed so a future failure names the culprit.
      - name: Use a modern npm
        run: |
          npm install --global npm@latest
          node --version
          npm --version

      - name: The checkout is the tag, and the tag is the version
        # Two names can resolve to one string — a branch called `v0.7.0` and the tag
        # `v0.7.0` — and a checkout given a bare name prefers whichever git finds first,
        # so HEAD is compared to the tag object itself rather than to the name.
        #
        # Then the version: npm reads it from package.json, not from the tag, so a
        # checkout that landed on the wrong commit would publish a number the release
        # page never named. A dispatch has no tag and publishes whatever `main` is.
        env:
          TAG: ${{ needs.release-please.outputs.tag_name || github.event.release.tag_name }}
        run: |
          if [ -z "$TAG" ]; then
            echo "no tag on this run: a dispatch publishes main"
            exit 0
          fi
          head_commit=$(git rev-parse HEAD)
          tag_commit=$(git rev-parse "refs/tags/$TAG^{commit}")
          if [ "$head_commit" != "$tag_commit" ]; then
            echo "refusing: HEAD is $head_commit but $TAG is $tag_commit" >&2
            exit 1
          fi
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "refusing: tag $TAG does not name package.json's version $version" >&2
            exit 1
          fi
          echo "$TAG names $head_commit, and package.json agrees on $version"

      - name: Publish
        # The bot path and a hand-made release publish; a dispatch publishes only when
        # the dry run was turned off.
        if: inputs.dry_run != true
        run: npm publish --access public --provenance
        env:
          # Deliberately allowed to be empty: npm prefers OIDC when the workflow is a
          # configured trusted publisher, and only falls back to this token while
          # bootstrapping the very first version.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
