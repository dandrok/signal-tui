name: release-please

# The version comes from the commits, not from a person typing a number: `feat` bumps
# the minor, `fix` the patch, and a `feat!` bumps the minor too while this is 0.x —
# 1.0.0 stays a deliberate human decision (see RELEASING.md).
#
# The bot keeps one PR open against main holding the bump and a first draft of the
# CHANGELOG section, written from the commit subjects. Merging that PR is the release
# decision: this workflow then tags the merge commit `vX.Y.Z`, opens the GitHub release,
# and calls the publish workflow in the same run.
#
# Called, not triggered. A release created with the repository's `GITHUB_TOKEN` does not
# start a new workflow run — GitHub suppresses the events that token causes, so a
# `release: published` trigger would never fire for the bot's own release. Calling
# `release.yml` as a reusable workflow is the same run, so nothing is suppressed and no
# personal token has to be stored to make writing a release work.
on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  # Unlike CI this is not cancelled by the next push: a run can be the one that tags a
  # commit, and stopping halfway is not a state worth landing in — the next run would
  # have to read the tag it may have half-made.
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Opens or updates the release PR; on the run after that PR merges, it tags and
      # releases. Nothing is published from here — publishing needs OIDC and the
      # `npm-publish` environment, which `release.yml` owns.
      #
      # Pinned to the v5.0.0 commit rather than the `v5` tag: this is the one action in
      # the repo that runs with `contents: write` and `pull-requests: write`, so a
      # re-pointed tag would be able to write to the repository.
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    # Only on the run that actually made a release: every other push to main stops at
    # the PR the job above opened or updated.
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      id-token: write # granted to the called workflow for OIDC
    uses: ./.github/workflows/release.yml
    secrets: inherit
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
      dry_run: false
